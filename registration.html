<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M-KICKS LIMITED — Register</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  :root {
    --gold: #000000;
    --dark: #f0f0f0;
    --text: #000000;
    --muted: #444444;
  }
  body { background-color: #f0f0f0; color: #000000; margin:0; }
  nav { background: #1a1a1a; border-bottom: 3px solid #000000; position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 48px; height: 66px; }
  .nav-logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.55rem; color: #f0f0f0; letter-spacing: 6px; text-decoration: none; }
  .nav-links { display: flex; list-style: none; gap: 2px; }
  .nav-links li a { font-family: 'DM Mono', monospace; font-size: .68rem; letter-spacing: 2px; text-transform: uppercase; color: #cccccc; text-decoration: none; padding: 8px 14px; border-radius: 4px; }
  .nav-links li a:hover, .nav-links li a.active { color: #ffffff; }
  .nav-cta { background: #ffffff; color: #000000 !important; font-weight: 700; border-radius: 4px; }

  .reg-wrap { max-width: 480px; margin: 0 auto; padding: 160px 24px 100px; }
  .eyebrow { font-family: 'DM Mono', monospace; font-size: .7rem; letter-spacing: 6px; color: #444444; text-transform: uppercase; margin-bottom: 12px; text-align:center; }
  h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.2rem, 6vw, 3rem); letter-spacing: 6px; text-align:center; margin: 0 0 8px; }
  .divider { width: 60px; height: 3px; background: #000000; margin: 18px auto 32px; }

  form { display: flex; flex-direction: column; gap: 16px; }
  label { font-family: 'DM Mono', monospace; font-size: .65rem; letter-spacing: 2px; text-transform: uppercase; color: #444444; margin-bottom: 6px; display:block; }
  input {
    width: 100%; padding: 12px 14px; border: 2px solid #000000; border-radius: 6px;
    background: #ffffff; font-family: 'DM Mono', monospace; font-size: .9rem; box-sizing: border-box;
  }
  input:focus { outline: none; border-color: #333333; }

  .btn-primary {
    background: #000000; color: #f0f0f0; padding: 14px 32px; border-radius: 6px;
    font-family: 'DM Mono', monospace; font-size: .75rem; letter-spacing: 2px;
    font-weight: 700; border: 2px solid #000000; cursor: pointer; margin-top: 8px;
  }
  .btn-primary:hover { background: #333333; }
  .btn-primary:disabled { opacity: .6; cursor: not-allowed; }

  #status { font-family: 'DM Mono', monospace; font-size: .75rem; text-align:center; margin-top: 16px; min-height: 20px; }
  .status-ok { color: #146c2e; }
  .status-err { color: #b3261e; }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">M-KICKS</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="collection.html">Collection</a></li>
    <li><a href="features.html">Features</a></li>
    <li><a href="vision.html">Vision</a></li>
    <li><a href="registration.html" class="nav-cta active">Register</a></li>
  </ul>
</nav>

<div class="reg-wrap">
  <p class="eyebrow">Join the movement</p>
  <h1>REGISTER</h1>
  <div class="divider"></div>

  <form id="regForm">
    <div>
      <label for="full_name">Full Name</label>
      <input type="text" id="full_name" required placeholder="Jane Doe">
    </div>
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="jane@example.com">
    </div>
    <div>
      <label for="phone">Phone (optional)</label>
      <input type="tel" id="phone" placeholder="+254 7...">
    </div>
    <button type="submit" class="btn-primary" id="submitBtn">Create Account →</button>
    <p id="status"></p>
  </form>
</div>

<!-- Supabase client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://fzdbcujtfywimbcribtm.supabase.co";
  const SUPABASE_KEY = "sb_publishable_WrcrZdGipj60FdOPxtF4LA_ouXl8068";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const form = document.getElementById('regForm');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting...";
    statusEl.textContent = "";
    statusEl.className = "";

    const full_name = document.getElementById('full_name').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();

    const { data, error } = await supabaseClient
      .from('registrations')
      .insert([{ full_name, email, phone: phone || null }]);

    if (error) {
      statusEl.textContent = "Error: " + error.message;
      statusEl.className = "status-err";
      submitBtn.disabled = false;
      submitBtn.textContent = "Create Account →";
    } else {
      statusEl.textContent = "Success! Redirecting...";
      statusEl.className = "status-ok";
      setTimeout(() => { window.location.href = "index.html"; }, 1200);
    }
  });
</script>
</body>
</html>
