<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Website</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
}

/* Simple button */
#openRegister {
  padding: 12px 20px;
  background: #ff4d6d;
  color: white;
  border: none;
  cursor: pointer;
  margin: 40px;
}

/* POPUP OVERLAY */
#regPopupOverlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: 9999;
}

/* POPUP BOX */
#regPopupBox {
  background: #fff;
  width: 300px;
  padding: 20px;
  border-radius: 10px;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

/* CLOSE BUTTON */
#closePopup {
  position: absolute;
  right: 10px;
  top: 5px;
  cursor: pointer;
  font-size: 20px;
}

/* INPUTS */
#regPopupBox input {
  width: 90%;
  padding: 8px;
  margin: 6px 0;
}

/* SUBMIT BUTTON */
#regPopupBox button {
  padding: 10px;
  margin-top: 10px;
  width: 100%;
  background: #28a745;
  color: white;
  border: none;
}
</style>
</head>

<body>

<!-- YOUR NORMAL WEBSITE CONTENT -->
<h1 style="text-align:center;">Welcome to My Website</h1>

<!-- REGISTER BUTTON -->
<div style="text-align:center;">
  <button id="openRegister">Register</button>
</div>

<!-- POPUP -->
<div id="regPopupOverlay">
  <div id="regPopupBox">
    <span id="closePopup">&times;</span>

    <h2>Create Account</h2>

    <form id="registerForm">
      <input type="text" id="regName" placeholder="Full Name"><br>
      <input type="email" id="regEmail" placeholder="Email"><br>
      <input type="password" id="regPassword" placeholder="Password"><br>

      <button type="submit">Register</button>
    </form>
  </div>
</div>

<script>
// OPEN POPUP
document.getElementById("openRegister").onclick = function() {
  document.getElementById("regPopupOverlay").style.display = "block";
};

// CLOSE POPUP
document.getElementById("closePopup").onclick = function() {
  document.getElementById("regPopupOverlay").style.display = "none";
};

// CLICK OUTSIDE TO CLOSE
window.onclick = function(e) {
  if (e.target == document.getElementById("regPopupOverlay")) {
    document.getElementById("regPopupOverlay").style.display = "none";
  }
};

// FORM VALIDATION
document.getElementById("registerForm").onsubmit = function(e) {
  e.preventDefault();

  let name = document.getElementById("regName").value;
  let email = document.getElementById("regEmail").value;
  let password = document.getElementById("regPassword").value;

  if (name === "" || email === "" || password === "") {
    alert("Fill all fields!");
    return;
  }

  if (password.length < 6) {
    alert("Password must be at least 6 characters");
    return;
  }

  alert("Registered successfully!");
  document.getElementById("regPopupOverlay").style.display = "none";
};
</script>

</body>
</html>
