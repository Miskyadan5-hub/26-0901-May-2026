<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M-KICKS LIMITED — Home</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
  body { background-color: #f0f0f0; color: #000; }

  nav {
    background:#1a1a1a;
    position:fixed; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:0 48px; height:66px;
    z-index:100;
  }

  .nav-logo { color:#fff; text-decoration:none; font-family:'Bebas Neue'; letter-spacing:6px; }
  .nav-links { display:flex; list-style:none; }
  .nav-links li a { color:#ccc; text-decoration:none; padding:10px; }
  .nav-links li a:hover { color:#fff; }

  .hero { padding:160px 20px; text-align:center; }

  /* POPUP */
  #welcomePopup {
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
    z-index:9999;
  }
</style>
</head>

<body>

<nav>
  <a href="index.html" class="nav-logo">M-KICKS</a>
  <ul class="nav-links">
    <li><a href="#">Home</a></li>
  </ul>
</nav>

<section class="hero">
  <h1>Welcome to M-KICKS</h1>
</section>

<!-- POPUP -->
<div id="welcomePopup">
  <div style="background:#fff;padding:20px;border-radius:10px;text-align:center;width:280px;position:relative;">
    <span onclick="closePopup()" style="position:absolute;top:5px;right:10px;cursor:pointer;font-size:20px;">&times;</span>
    <h3>Welcome 👋</h3>
    <p>Welcome to M-KICKS LIMITED</p>
    <button onclick="closePopup()" style="margin-top:10px;padding:8px 16px;background:#000;color:#fff;border:none;border-radius:5px;">
      Enter
    </button>
  </div>
</div>

<script>
  // NAV TOGGLE (kept safe)
  document.addEventListener("DOMContentLoaded", function() {

    // Show popup when page loads
    document.getElementById("welcomePopup").style.display = "flex";

    // Nav toggle (your original)
    const nt = document.getElementById('nt');
    if(nt){
      nt.addEventListener('click', () =>
        document.getElementById('nl').classList.toggle('open')
      );
    }
  });

  function closePopup() {
    document.getElementById("welcomePopup").style.display = "none";
  }
</script>

</body>
</html>
