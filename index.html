<!-- FORM -->
<form id="myForm">
  <input type="text" id="name" placeholder="Enter your name"><br><br>
  <input type="email" id="email" placeholder="Enter your email"><br><br>
  <button type="submit">Submit</button>
</form>

<!-- VALIDATION POPUP -->
<div id="validationPopup" style="
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.7);
">
  <div style="
    background:#fff;
    color:#000;
    padding:20px;
    width:300px;
    margin:15% auto;
    text-align:center;
    border-radius:10px;
  ">
    <p id="validationMessage"></p>
    <button onclick="document.getElementById('validationPopup').style.display='none'">
      OK
    </button>
  </div>
</div>

<script>
document.getElementById("myForm").addEventListener("submit", function(e) {
  e.preventDefault();

  let name = document.getElementById("name").value.trim();
  let email = document.getElementById("email").value.trim();
  let message = "";
  let msgColor = "red";

  if (name === "" || email === "") {
    message = "Please fill in all fields!";
  } 
  else if (!email.includes("@") || !email.includes(".")) {
    message = "Enter a valid email!";
  } 
  else {
    message = "Form submitted successfully!";
    msgColor = "green";
  }

  let msg = document.getElementById("validationMessage");
  msg.innerText = message;
  msg.style.color = msgColor;

  document.getElementById("validationPopup").style.display = "block";
});
</script>
