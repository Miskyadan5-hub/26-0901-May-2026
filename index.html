<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Website</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  text-align: center;
}

/* Button */
#openRegister {
  padding: 12px 20px;
  background: #ff4d6d;
  color: white;
  border: none;
  cursor: pointer;
  margin-top: 50px;
}

/* Popup overlay */
#popupOverlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
}

/* Popup box */
#popupBox {
  background: white;
  width: 300px;
  padding: 20px;
  border-radius: 10px;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

/* Close button */
#closePopup {
  position: absolute;
  right: 10px;
  top: 5px;
  cursor: pointer;
  font-size: 20px;
}

/* Inputs */
input {
  width: 90%;
  padding: 8px;
  margin: 6px 0;
}

/* Submit button */
button[type="submit"] {
  width: 100%;
  padding: 10px;
  background: green;
  color: white;
  border: none;
}
</style>
</head>

<body>

<h1>Welcome to My Website</h1>

<button id="openRegister">Register</button>

<!-- POPUP -->
<div id="popupOverlay">
  <div id="popupBox">
    <span id="closePopup">&times;</span>

    <h2>Register</h2>

    <form onsubmit="return goToSite(event)">
      <input type="text" id="name" placeholder="Full Name">
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Password">

      <button type="submit">Register</button>
    </form>
  </div>
</div>

<script>
// open popup
document.getElementById("openRegister").onclick = function() {
  document.getElementById("popupOverlay").style.display = "block";
};

// close popup
document.getElementById("closePopup").onclick = function() {
  document.getElementById("popupOverlay").style.display = "none";
};

// form function
function goToSite(e) {
  e.preventDefault();

  let name = document.getElementById("name").value;
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  if (!name || !email || !password) {
    alert("Please fill all fields");
    return false;
  }

  if (password.length < 6) {
    alert("Password must be at least 6 characters");
    return false;
  }

  // close popup
  document.getElementById("popupOverlay").style.display = "none";

  // reload page (fixes blank issue)
  location.reload();

  return false;
}
</script>

</body>
</html>
