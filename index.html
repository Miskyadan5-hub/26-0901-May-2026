<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M-KICKS LIMITED — Home</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond&family=DM+Mono&display=swap" rel="stylesheet">

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f0f0f0;
}

/* NAV */
nav {
  background: #1a1a1a;
  color: white;
  display: flex;
  justify-content: space-between;
  padding: 15px 30px;
}

.nav-links {
  list-style: none;
  display: flex;
  gap: 15px;
}

.nav-links a {
  color: white;
  text-decoration: none;
}

/* HERO */
.hero {
  text-align: center;
  padding: 120px 20px;
}

.hero h1 {
  font-family: 'Bebas Neue';
  font-size: 60px;
}

/* FORM */
form {
  max-width: 400px;
  margin: auto;
}

input {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
}

button {
  padding: 12px;
  width: 100%;
  background: black;
  color: white;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
  <div>M-KICKS</div>
  <ul class="nav-links">
    <li><a href="#">Home</a></li>
    <li><a href="#">Collection</a></li>
  </ul>
</nav>

<!-- HERO -->
<section class="hero">
  <h1>M-KICKS LIMITED</h1>
  <p>Style from the ground up.</p>
</section>

<!-- REGISTER FORM -->
<div style="text-align:center;">
  <h2>Register</h2>

  <form id="registerForm">
    <input type="text" id="username" placeholder="Username" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Register</button>
  </form>
</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// MENU (optional)
document.querySelector("nav").addEventListener("click", () => {});

// CONNECT SUPABASE
const supabaseUrl = "https://fzdbcujtfywimbcribtm.supabase.co"
const supabaseKey = "sb_publishable_WrcrZdGipj60FdOPxtF4LA_ouXl8068";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

// REGISTER FUNCTION
document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const username = document.getElementById("username").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await supabase
    .from("users")
    .insert([{ username, email, password }]);

  if (error) {
    alert("Error: " + error.message);
    console.log(error);
  } else {
    alert("Registered successfully!");
    document.getElementById("registerForm").reset();
  }
});
</script>

</body>
</html>
