<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Website</title>

<style>
  <!-- REGISTER BUTTON (you can move this anywhere later) -->
<button onclick="openRegisterPopup()" style="padding:10px 20px; cursor:pointer;">
  Register
</button>

<!-- POPUP -->
<div id="popupOverlay" style="
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  z-index:99999;
">
  <div style="
    background:#fff;
    width:300px;
    padding:20px;
    border-radius:10px;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    text-align:center;
  ">
    <span onclick="closeRegisterPopup()" style="
      position:absolute;
      right:10px;
      top:5px;
      cursor:pointer;
      font-size:20px;
    ">&times;</span>

    <h2>Register</h2>

    <form onsubmit="return handleRegister(event)">
      <input type="text" id="name" placeholder="Full Name" style="width:90%; padding:8px; margin:5px;"><br>
      <input type="email" id="email" placeholder="Email" style="width:90%; padding:8px; margin:5px;"><br>
      <input type="password" id="password" placeholder="Password" style="width:90%; padding:8px; margin:5px;"><br>

      <button type="submit" style="margin-top:10px; padding:10px; width:100%;">
        Submit
      </button>
    </form>
  </div>
</div>

<script>
// MAKE SURE JS LOADS AFTER PAGE
window.onload = function() {

  window.openRegisterPopup = function() {
    document.getElementById("popupOverlay").style.display = "block";
  };

  window.closeRegisterPopup = function() {
    document.getElementById("popupOverlay").style.display = "none";
  };

  window.handleRegister = function(e) {
    e.preventDefault();

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    if (!name || !email || !password) {
      alert("Please fill all fields");
      return false;
    }

    if (password.length < 6) {
      alert("Password must be at least 6 characters");
      return false;
    }

    alert("Registration successful!");
    closeRegisterPopup();
    return false;
  };

};
</script>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
}

/* Simple button */
#openRegister {
  padding: 12px 20px;
  background: #ff4d6d;
  color: white;
  border: none;
  cursor: pointer;
  margin: 40px;
}

/* POPUP OVERLAY */
#regPopupOverlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: 9999;
}

/* POPUP BOX */
#regPopupBox {
  background: #fff;
  width: 300px;
  padding: 20px;
  border-radius: 10px;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

/* CLOSE BUTTON */
#closePopup {
  position: absolute;
  right: 10px;
  top: 5px;
  cursor: pointer;
  font-size: 20px;
}

/* INPUTS */
#regPopupBox input {
  width: 90%;
  padding: 8px;
  margin: 6px 0;
}

/* SUBMIT BUTTON */
#regPopupBox button {
  padding: 10px;
  margin-top: 10px;
  width: 100%;
  background: #28a745;
  color: white;
  border: none;
}
</style>
</head>

<body>

<!-- YOUR NORMAL WEBSITE CONTENT -->
<h1 style="text-align:center;">Welcome to My Website</h1>

<!-- REGISTER BUTTON -->
<div style="text-align:center;">
  <button id="openRegister">Register</button>
</div>

<!-- POPUP -->
<div id="regPopupOverlay">
  <div id="regPopupBox">
    <span id="closePopup">&times;</span>

    <h2>Create Account</h2>

    <form id="registerForm">
      <input type="text" id="regName" placeholder="Full Name"><br>
      <input type="email" id="regEmail" placeholder="Email"><br>
      <input type="password" id="regPassword" placeholder="Password"><br>

      <button type="submit">Register</button>
    </form>
  </div>
</div>

<script>
// OPEN POPUP
document.getElementById("openRegister").onclick = function() {
  document.getElementById("regPopupOverlay").style.display = "block";
};

// CLOSE POPUP
document.getElementById("closePopup").onclick = function() {
  document.getElementById("regPopupOverlay").style.display = "none";
};

// CLICK OUTSIDE TO CLOSE
window.onclick = function(e) {
  if (e.target == document.getElementById("regPopupOverlay")) {
    document.getElementById("regPopupOverlay").style.display = "none";
  }
};

// FORM VALIDATION
document.getElementById("registerForm").onsubmit = function(e) {
  e.preventDefault();

  let name = document.getElementById("regName").value;
  let email = document.getElementById("regEmail").value;
  let password = document.getElementById("regPassword").value;

  if (name === "" || email === "" || password === "") {
    alert("Fill all fields!");
    return;
  }

  if (password.length < 6) {
    alert("Password must be at least 6 characters");
    return;
  }

  alert("Registered successfully!");
  document.getElementById("regPopupOverlay").style.display = "none";
};
</script>

</body>
</html>
