<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B-LUX ONE LIMITED — Home</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">

<style>
:root {
  --gold:#f0c040; --gold-dim:#b8902a; --teal:#0e8a72; --teal-dark:#086455;
  --dark:#0f0f0f; --dark2:#161616; --dark3:#1e1e1e; --dark4:#252525;
  --text:#e2ddd4; --muted:#8a8278;
  --border:rgba(240,192,64,0.12); --border2:rgba(14,138,114,0.25);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}


body{
  font-family:'Cormorant Garamond',Georgia,serif;
  background:var(--dark);
  color:var(--text);
  overflow-x:hidden;
}



/* BACKGROUND */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
  radial-gradient(ellipse 80% 60% at 15% 20%,rgba(14,138,114,.1) 0%,transparent 60%),
  radial-gradient(ellipse 60% 50% at 85% 80%,rgba(240,192,64,.07) 0%,transparent 55%),
  radial-gradient(ellipse 40% 40% at 60% 10%,rgba(14,138,114,.05) 0%,transparent 50%);
  pointer-events:none;
  z-index:0;
}

/* NAV */
nav{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:100;
  background:rgba(8,8,8,.92);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 48px;
  height:66px;
}

.nav-logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:1.55rem;
  color:var(--gold);
  letter-spacing:6px;
  text-decoration:none;
}

.nav-links{
  display:flex;
  list-style:none;
  gap:2px;
}

.nav-links li a{
  font-family:'DM Mono',monospace;
  font-size:0.68rem;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--muted);
  text-decoration:none;
  padding:8px 14px;
  border-radius:4px;
}

.nav-links li a:hover{
  color:var(--gold);
}

.nav-cta{
  background:var(--gold);
  color:#000;
  font-weight:700;
  border-radius:4px;
}

/* HERO */
.hero{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:100px 40px 80px;
}

/* BUTTONS FIXED */
.btn-primary,
.btn-outline,
.back-top{
  cursor:pointer;
}

/* FOOTER */
footer{
  background:var(--dark2);
  text-align:center;
  padding:30px;
  font-family:'DM Mono',monospace;
  font-size:.65rem;
  color:var(--muted);
}
</style>
</head>

<body>



<a href="#" class="back-top" id="bt">↑</a>

<nav>
  <a href="index.html" class="nav-logo">B-LUX</a>
  <ul class="nav-links">
    <li><a href="index.html" class="active">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="collection.html">Collection</a></li>
    <li><a href="features.html">Features</a></li>
    <li><a href="vision.html">Vision</a></li>
    <li><a href="contact.html" class="nav-cta">Contact</a></li>
  </ul>
</nav>

<section class="hero">
  <h1>B-LUX <span>ONE LIMITED</span></h1>
  <p>Shoes are more than something you wear — they're how you move through the world.</p>

  <div style="margin-top:30px;">
    <a href="collection.html" class="btn-primary">Shop Collection</a>
    <a href="about.html" class="btn-outline">Our Story</a>
  </div>
</section>

<footer>
©️ 2026 B-LUX ONE LIMITED | Designed by Brasil Wahanda
</footer>

<script>
/* ✅ KEEP ONLY useful JS */
window.addEventListener('scroll',()=>{
  document.getElementById('bt').classList.toggle('visible',scrollY>400);
});
</script>

</body>
</html>
