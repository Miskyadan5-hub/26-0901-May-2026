<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M-KICKS LIMITED</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f4f4f4;
}

/* NAV */
nav {
  background: #111;
  color: white;
  display: flex;
  justify-content: space-between;
  padding: 15px 30px;
}

.nav-links {
  list-style: none;
  display: flex;
  gap: 15px;
}

.nav-links a {
  color: white;
  text-decoration: none;
}

/* HERO */
.hero {
  text-align: center;
  padding: 100px 20px;
}

.hero h1 {
  font-family: 'Bebas Neue';
  font-size: 60px;
}

/* FORM */
.container {
  text-align: center;
  padding: 20px;
}

form {
  max-width: 400px;
  margin: auto;
}

input {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
}

button {
  padding: 12px;
  width: 100%;
  background: black;
  color: white;
  border: none;
  cursor: pointer;
}

ul {
  max-width: 400px;
  margin: 20px auto;
  padding: 0;
}

li {
  list-style: none;
  background: white;
  margin: 5px 0;
  padding: 10px;
  border-radius: 5px;
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
  <div>M-KICKS</div>
  <ul class="nav-links">
    <li><a href="#">Home</a></li>
    <li><a href="#">Collection</a></li>
  </ul>
</nav>

<!-- HERO -->
<section class="hero">
  <h1>M-KICKS LIMITED</h1>
  <p>Style from the ground up.</p>
</section>

<!-- REGISTER -->
<div class="container">
  <h2>Register</h2>

  <form id="registerForm">
    <input type="text" id="username" placeholder="Username" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Register</button>
  </form>

  <h2>Registered Users</h2>
  <ul id="userList"></ul>
</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// 🔥 PUT YOUR REAL DETAILS HERE
const supabaseUrl = "https://fzdbcujtfywimbcribtm.supabase.co";
const supabaseKey = "sb_publishable_WrcrZdGipj60FdOPxtF4LA_ouXl8068";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

// LOAD USERS
async function loadUsers() {
  const { data, error } = await supabase
    .from("misky")
    .select("*");

  if (error) {
    console.log(error);
    return;
  }

  const list = document.getElementById("userList");
  list.innerHTML = "";

  data.forEach(user => {
    const li = document.createElement("li");
    li.textContent = user.username + " (" + user.email + ")";
    list.appendChild(li);
  });
}

// REGISTER
document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const username = document.getElementById("username").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await supabase
    .from("misky")
    .insert([{ username, email, password }]);

  if (error) {
    alert("Error: " + error.message);
    console.log(error);
  } else {
    alert("Registered successfully!");
    document.getElementById("registerForm").reset();
    loadUsers();
  }
});

// LOAD ON START
loadUsers();
</script>

</body>
</html>
