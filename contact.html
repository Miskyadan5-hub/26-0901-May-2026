<form id="contactForm">
  <div>
    <label for="full_name">Full Name</label>
    <input type="text" id="full_name" required placeholder="Your name">
  </div>
  <div>
    <label for="email">Email</label>
    <input type="email" id="email" required placeholder="you@example.com">
  </div>
  <div>
    <label for="message">Message</label>
    <textarea id="message" required placeholder="Your message" rows="5"></textarea>
  </div>
  <button type="submit" id="submitBtn">Send Message →</button>
  <p id="status"></p>
</form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseClient = supabase.createClient(
    "https://fzdbcujtfywimbcribtm.supabase.co",
    "sb_publishable_WrcrZdGipj60FdOPxtF4LA_ouXl8068"
  );

  document.getElementById('contactForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    const statusEl = document.getElementById('status');
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending...";

    const full_name = document.getElementById('full_name').value.trim();
    const email = document.getElementById('email').value.trim();
    const message = document.getElementById('message').value.trim();

    const { error } = await supabaseClient
      .from('contacts')
      .insert([{ full_name, email, message }]);

    if (error) {
      statusEl.textContent = "Error: " + error.message;
      statusEl.style.color = "red";
      submitBtn.disabled = false;
      submitBtn.textContent = "Send Message →";
    } else {
      statusEl.textContent = "Message sent! Thank you.";
      statusEl.style.color = "green";
      document.getElementById('contactForm').reset();
      submitBtn.disabled = false;
      submitBtn.textContent = "Send Message →";
    }
  });
</script>
